<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Kuesioner PCA</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
    <style>
        .dashboard-layout { display: flex; gap: 20px; }
        .sidebar-filter { flex: 1; max-width: 250px; }
        .main-content { flex: 3; }
        .chart-box { background: rgba(0,0,0,0.2); border-radius: 15px; padding: 15px; margin-bottom: 20px; }
        .filter-group { margin-bottom: 15px; }
        .filter-group select { width: 100%; padding: 10px; border-radius: 8px; background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.3); }
        .filter-group select option { color: black; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    </style>
</head>
<body>
    <div class="glass-container main-wrapper" id="loginSection">
        <h2>🔒 Login Admin</h2>
        <form id="loginForm">
            <div class="form-group">
                <input type="text" id="username" placeholder="Username" required>
            </div>
            <div class="form-group">
                <input type="password" id="password" placeholder="Password" required>
            </div>
            <button type="submit" class="submit-btn">Masuk Dashboard</button>
        </form>
        <div id="loginAlert" class="alert error hidden"></div>
    </div>

    <div class="glass-container main-wrapper hidden" id="dashboardSection" style="max-width: 1200px;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h2>📊 Executive Dashboard</h2>
            <button id="logoutBtn" class="submit-btn" style="width: auto; padding: 10px 20px; background: rgba(239, 68, 68, 0.3);">Logout</button>
        </div>
        
        <button id="prosesBtn" class="submit-btn" style="margin-bottom: 20px;">🚀 Tarik & Proses Data Server</button>
        <div id="statusText" class="alert hidden" style="margin-bottom: 20px;"></div>

        <div id="panelDashboard" class="dashboard-layout hidden">
            
            <div class="glass-panel sidebar-filter">
                <h3>🎛️ Filter Data</h3>
                <div class="filter-group">
                    <label>Jurusan:</label>
                    <select id="filterJurusan"><option value="ALL">Semua Jurusan</option></select>
                </div>
                <div class="filter-group">
                    <label>Kelas:</label>
                    <select id="filterKelas"><option value="ALL">Semua Kelas</option></select>
                </div>
                <div class="filter-group">
                    <label>Jenis Kelamin:</label>
                    <select id="filterGender"><option value="ALL">Semua</option></select>
                </div>
            </div>

            <div class="main-content">
                <div class="glass-panel grid-2">
                    <div>
                        <p style="margin:0; font-size: 14px; opacity: 0.8;">Total Responden Filtered</p>
                        <h2 id="metricTotal" style="margin:0; color: #3b82f6;">0</h2>
                    </div>
                    <div>
                        <p style="margin:0; font-size: 14px; opacity: 0.8;">Variansi Kumulatif PCA</p>
                        <h2 id="metricVariansi" style="margin:0; color: #10b981;">0%</h2>
                    </div>
                </div>

                <div class="glass-panel chart-box">
                    <div id="scatter3DChart" style="width: 100%; height: 500px;"></div>
                </div>

                <div class="grid-2">
                    <div class="glass-panel chart-box">
                        <h3 style="text-align: center; margin-top:0;">Kinerja Global</h3>
                        <div id="radarChart" style="width: 100%; height: 350px;"></div>
                    </div>
                    <div class="glass-panel chart-box">
                        <h3 style="text-align: center; margin-top:0;">Proporsi Jurusan</h3>
                        <div id="donutChart" style="width: 100%; height: 350px;"></div>
                    </div>
                </div>

                <div class="glass-panel chart-box">
                    <h3 style="text-align: center; margin-top:0;">Skor Rata-Rata Per Klaster</h3>
                    <div id="barChart" style="width: 100%; height: 400px;"></div>
                </div>

                <div class="glass-panel">
                    <h2>📋 Bedah Investigasi Otomatis</h2>
                    <div id="investigasiContainer"></div>
                </div>
            </div>
        </div>
    </div>
    <script src="admin.js"></script>
</body>
</html>
